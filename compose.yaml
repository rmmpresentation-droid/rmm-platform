services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rmm
      POSTGRES_USER: rmm
      POSTGRES_PASSWORD: rmm_local
    volumes:
      - rmm_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rmm -d rmm"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    command: ["node", "server/index.mjs"]
    environment:
      DATABASE_URL: postgres://rmm:rmm_local@db:5432/rmm
      RMM_ADMIN_EMAIL: ${RMM_ADMIN_EMAIL:?Définissez RMM_ADMIN_EMAIL dans .env}
      RMM_ADMIN_PASSWORD: ${RMM_ADMIN_PASSWORD:?Définissez RMM_ADMIN_PASSWORD dans .env}
      RMM_PUBLIC_REQUEST_ADMIN_ID: ${RMM_PUBLIC_REQUEST_ADMIN_ID:-}
    depends_on:
      db:
        condition: service_healthy
  web:
    build: .
    environment:
      API_PROXY_TARGET: http://api:3001
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      - api
volumes:
  rmm_db:
